<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXELMART ตลาดของเกมไทย</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050810;--card:#0b1124;--line:#1b2850;--a:#27e3ff;--b:#8b5cf6;--tx:#e8eeff;--mut:#7f8cb5;--ok:#4ade80;--cut:14px}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 85% -5%,rgba(139,92,246,.28),transparent),radial-gradient(500px 400px at 0 25%,rgba(39,227,255,.13),transparent),linear-gradient(rgba(39,227,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(39,227,255,.05) 1px,transparent 1px);background-size:auto,auto,36px 36px,36px 36px}
nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(5,8,16,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font:700 22px Kanit,sans-serif;letter-spacing:1px;cursor:pointer;white-space:nowrap}.logo span{color:var(--a)}
.nl{margin-left:auto;display:flex;gap:4px;align-items:center;overflow-x:auto}
.nl a{padding:7px 12px;border-radius:99px;color:var(--mut);cursor:pointer;font-size:14px;white-space:nowrap}.nl a:hover{color:var(--tx);background:var(--card)}
.nl a.cta{background:linear-gradient(90deg,var(--a),var(--b));color:#021018;font-weight:600}
main{max-width:980px;margin:auto;padding:16px}
h2,h3{font-family:Kanit,sans-serif}
input,select,textarea,button{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);width:100%;margin:4px 0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a);border-color:transparent}
button{width:auto;background:linear-gradient(90deg,var(--a),var(--b));color:#021018;border:0;font-weight:600;cursor:pointer;padding:11px 18px}
button.g{background:none;color:var(--tx);border:1px solid var(--line)}
input[type=checkbox]{width:auto}
.hero{padding:30px 0 10px}
.hero h1{font:700 clamp(30px,7vw,54px)/1.12 Kanit,sans-serif;margin:0 0 10px;max-width:14em}
.hero p{margin:0 0 16px;max-width:34em}
.sr{padding:15px 16px;font-size:16px;border-color:var(--a);box-shadow:0 0 0 4px rgba(39,227,255,.08)}
.trust{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.trust span{font-size:13px;color:var(--mut);border:1px solid var(--line);padding:5px 12px;border-radius:99px;background:rgba(11,17,36,.7)}
.tiles{display:flex;gap:10px;overflow-x:auto;padding:14px 0 4px}
.tile{flex:0 0 auto;min-width:78px;text-align:center;padding:10px 8px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;font-size:13px;font-weight:500}
.tile i{font-style:normal;font-size:24px;display:block}
.tile.on{border-color:var(--a);background:linear-gradient(160deg,rgba(39,227,255,.18),rgba(139,92,246,.2))}
.sh{font-size:20px;margin:22px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{padding:1px;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--line) 40%,var(--b));clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.ci{position:relative;background:var(--card);height:100%;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.ci img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#121b3a}
.ph{display:flex;align-items:center;justify-content:center;font-size:42px}
.pt{position:absolute;right:0;top:10px;background:var(--a);color:#021018;font:700 15px Kanit,sans-serif;padding:3px 12px 3px 18px;clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%)}
.p{padding:10px 12px 14px}.p h3{margin:4px 0 0;font-size:15px;font-weight:500}
.pr{color:var(--a)}.m{color:var(--mut);font-size:13px}
.empty{grid-column:1/-1;text-align:center;padding:36px 12px;border:1px dashed var(--line);border-radius:14px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0}
#md{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:12px;z-index:9}
.box{background:var(--card);border:1px solid var(--a);border-radius:16px;padding:18px;max-width:480px;width:100%;max-height:90vh;overflow:auto;position:relative}
.x{position:absolute;right:14px;top:8px;cursor:pointer}
.big{width:100%;border-radius:12px}.d{white-space:pre-wrap}
.bd{font-size:12px;color:var(--ok);font-style:normal}
footer{margin-top:40px;padding:24px 16px;border-top:1px solid var(--line);color:var(--mut);font-size:13px;text-align:center}
#ts{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--a);padding:10px 16px;border-radius:99px;z-index:10}
.pin{white-space:pre-wrap;font:inherit;font-size:13px;background:rgba(39,227,255,.08);border:1px solid var(--a);border-radius:12px;padding:10px 12px;margin:8px 0}
.cm{display:flex;flex-direction:column;gap:6px;max-height:45vh;overflow-y:auto;padding:6px 0}
.msg{max-width:82%;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);align-self:flex-start;word-break:break-word}
.msg.me{align-self:flex-end;background:rgba(39,227,255,.14)}
.msg img{max-width:100%;border-radius:8px}
.sys{align-self:center;color:var(--mut);font-size:12px;text-align:center}
.sendr{display:flex;gap:6px;align-items:center}.sendr input{margin:0}
.att{cursor:pointer;font-size:22px}
</style></head><body>
<nav id="nav"></nav><main id="main"></main><footer>PIXELMART ตลาดฝากขายของเกมสำหรับคนไทย<br>เว็บเป็นเพียงที่ฝากขาย ไม่รับผิดชอบการซื้อขายระหว่างผู้ใช้ ค่าลงประกาศไม่คืนเงินทุกกรณี<br>เวอร์ชัน 1.4</footer><div id="md"></div><div id="ts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL='https://ckwmkbuhylkglbbzcsfy.supabase.co',SUPA_KEY='sb_publishable_cky0ecswyluBHEkeYODPZQ_PvemV6jy';
const db=supabase.createClient(SUPA_URL,SUPA_KEY);
const CATS=['เกม','โมเดล 3D','2D','UI','ไอคอน','สคริปต์','เสียง','เพลง'];
const ST={unpaid:'ยังไม่จ่าย',pending:'รอตรวจสอบ',live:'กำลังขาย',rejected:'ไม่ผ่าน',expired:'หมดอายุ',approved:'เงินเข้าแล้ว',rejected_:'ไม่ผ่าน'};
const LC='id,seller,title,category,price,description,image_url,status,fee_paid,fee_percent,reject_reason,expires_at,created_at';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,prof=null,view='home',cat='',q='',S={};
const isStaff=()=>prof&&['admin','ceo'].includes(prof.role),isCeo=()=>prof&&prof.role==='ceo';
const badge=r=>r=='verified'?'<i class=bd>✔ ยืนยันตัวตน</i>':(r=='ceo'||r=='admin')?'<i class=bd>ทีมงาน</i>':'';
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
function modal(h){$('#md').innerHTML='<div class=box><span class=x onclick=closeM()>✕</span>'+h+'</div>';$('#md').style.display='flex'}
function closeM(){$('#md').style.display='none'}
async function loadS(){const{data}=await db.from('settings').select('*');(data||[]).forEach(r=>S[r.key]=r.value)}
window.onerror=m=>document.body.insertAdjacentHTML('afterbegin','<p style="color:#f87171;padding:8px">เกิดข้อผิดพลาด: '+esc(m)+'</p>');
db.auth.onAuthStateChange((ev,s)=>{if(ev=='PASSWORD_RECOVERY')setTimeout(newPwM,400);const u=s?.user||null;if(ev!='INITIAL_SESSION'&&ev!='PASSWORD_RECOVERY'&&(u?.id||null)===(me?.id||null)){me=u;return}setTimeout(async()=>{me=u;prof=null;try{await loadS();if(me)prof=(await db.from('profiles').select('*').eq('id',me.id).single()).data}catch(e){}render()},0)});
let tm=null,cid=0,sig='';
function go(v){view=v;clearInterval(tm);scrollTo(0,0);render()}
async function forgot(){const e=$('#em').value;if(!e)return toast('ใส่อีเมลก่อน');const{error}=await db.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});toast(error?error.message:'ส่งลิงก์ตั้งรหัสใหม่ไปที่อีเมลแล้ว')}
function newPwM(){modal('<h2>ตั้งรหัสผ่านใหม่</h2><input id=np type=password placeholder="รหัสผ่านใหม่ 6 ตัวขึ้นไป"><button onclick=setPw()>บันทึก</button>')}
async function setPw(){const{error}=await db.auth.updateUser({password:$('#np').value});if(!error)closeM();toast(error?error.message:'เปลี่ยนรหัสผ่านแล้ว')}
const PIN='📌 ขั้นตอนซื้อขาย\n1 ตกลงรายละเอียดและราคาในห้องนี้\n2 กด "แจ้งแอดมิน" เมื่อตกลงกันแล้ว\n3 แอดมินรับเรื่อง\n4 ผู้ขายส่งเลขบัญชีรับเงินในห้อง\n5 ผู้ซื้อโอนตรงให้ผู้ขาย แล้วแนบสลิป\n6 ผู้ซื้อกด "โอนแล้ว" ผู้ขายเช็คเงินเข้าในแอปธนาคารของตัวเอง (ไม่ดูแค่สลิป) แล้วกด "ได้รับเงินแล้ว"\n7 แอดมินส่งสินค้าให้ผู้ซื้อ\nเว็บเป็นเพียงที่ฝากขาย ไม่รับผิดชอบการซื้อขาย';
const stText=c=>c.closed?'ปิดแล้ว':c.delivered?'ส่งสินค้าแล้ว':c.seller_ok?'รอแอดมินส่งสินค้า':c.buyer_paid?'ผู้ซื้อโอนแล้ว':c.admin_ok?'แอดมินรับเรื่องแล้ว':c.called?'รอแอดมิน':'กำลังคุย';
function openChat(id){cid=id;sig='';go('chat')}
async function chats(){
 if(!me){$('#main').innerHTML='<button onclick=authM()>เข้าสู่ระบบ</button>';return}
 let r=db.from('chats').select('*').eq('closed',false).order('id',{ascending:false});
 if(isStaff())r=r.eq('called',true);
 const L=(await r).data||[];
 $('#main').innerHTML='<h2>แชท</h2>'+(L.length?L.map(c=>`<div class=row onclick="openChat(${c.id})" style="cursor:pointer"><span>${esc(c.title)}</span><span class=m>${stText(c)}</span></div>`).join(''):'<p class=m>ยังไม่มีห้องแชท กดติดต่อผู้ขายจากหน้าสินค้า</p>')}
async function chat(){if(!me)return go('home');await drawChat();tm=setInterval(drawChat,4000)}
async function drawChat(){
 const c=(await db.from('chats').select('*').eq('id',cid).single()).data;if(!c)return;
 const M=(await db.from('messages').select('*').eq('chat_id',cid).order('id')).data||[];
 const s2=[c.called,c.admin_ok,c.buyer_paid,c.seller_ok,c.delivered,c.closed,M.length,M.length?M[M.length-1].id:0].join();
 if($('#cm')&&s2==sig)return;sig=s2;
 const ids=[...new Set([c.buyer,c.seller,...M.map(m=>m.sender).filter(Boolean)])],nm={};
 for(const u of (await db.from('seller_info').select('*').in('id',ids)).data||[])nm[u.id]=u.name;
 if(!$('#cm'))$('#main').innerHTML=`<div id=ch></div><pre class=pin>${PIN}</pre><div id=ca></div><div id=cm class=cm></div><div class=sendr><input id=tx placeholder="พิมพ์ข้อความ" onkeydown="if(event.key=='Enter')send()"><label class=att>📎<input type=file id=fl hidden onchange=sendFile()></label><button onclick=send()>ส่ง</button></div>`;
 const B=c.buyer==me.id,Sl=c.seller==me.id,st=isStaff(),op=!c.closed;
 $('#ch').innerHTML=`<button class=g onclick="go('chats')">กลับ</button><h2>${esc(c.title)}</h2><p class=m>ผู้ซื้อ ${esc(nm[c.buyer])} ผู้ขาย ${esc(nm[c.seller])} สถานะ ${stText(c)}</p>`;
 $('#ca').innerHTML=(op&&!c.called&&(B||Sl)?`<button onclick="act('call')">แจ้งแอดมิน</button> `:'')+(op&&c.called&&!c.admin_ok&&st?`<button onclick="act('ok')">รับเรื่อง</button> `:'')+(op&&B&&c.admin_ok&&!c.buyer_paid?`<button onclick="act('paid')">โอนแล้ว</button> `:'')+(op&&Sl&&c.buyer_paid&&!c.seller_ok?`<button onclick="act('received')">ได้รับเงินแล้ว</button> `:'')+(op&&st&&c.buyer_paid&&c.seller_ok&&!c.delivered?`<button onclick="act('deliver')">ส่งสินค้าให้ผู้ซื้อ</button> `:'')+((st||(B&&c.delivered))?`<button class=g onclick=delivery()>ข้อมูลสินค้าที่ส่งมอบ</button> `:'')+(op&&st?`<button class=g onclick="act('close')">ปิดห้อง</button>`:'');
 let h='';
 for(const m of M){
  if(m.kind=='system'){h+=`<div class=sys>${esc(m.body)}</div>`;continue}
  let b=esc(m.body);
  if(m.kind=='file'){const u=(await db.storage.from('chatfiles').createSignedUrl(m.file_path,3600)).data?.signedUrl||'';b=/\.(png|jpe?g|gif|webp)$/i.test(m.file_path)?`<a href="${esc(u)}" target=_blank><img src="${esc(u)}" alt=""></a>`:`<a href="${esc(u)}" target=_blank style="color:var(--a)">📎 ${b}</a>`}
  h+=`<div class="msg ${m.sender==me.id?'me':''}"><div class=m>${esc(nm[m.sender]||'')}</div>${b}</div>`}
 $('#cm').innerHTML=h;$('#cm').scrollTop=1e9}
async function act(a){const{error}=await db.rpc('chat_action',{cid,act:a});if(error)toast(error.message);sig='';drawChat()}
async function send(){const t=$('#tx').value.trim();if(!t)return;$('#tx').value='';const{error}=await db.from('messages').insert({chat_id:cid,sender:me.id,body:t});if(error)toast(error.message);sig='';drawChat()}
async function sendFile(){const f=$('#fl').files[0];if(!f)return;const p=cid+'/'+Date.now()+'-'+f.name.replace(/[^\w.]/g,'');const u=await db.storage.from('chatfiles').upload(p,f);if(u.error)return toast(u.error.message);await db.from('messages').insert({chat_id:cid,sender:me.id,kind:'file',body:f.name,file_path:p});sig='';drawChat()}
async function delivery(){const{data,error}=await db.rpc('get_delivery',{cid});if(error)return toast(error.message);let u='';if(data.file)u=(await db.storage.from('deliver').createSignedUrl(data.file,600)).data?.signedUrl||'';modal(`<h2>ข้อมูลสินค้าที่ส่งมอบ</h2><p class=d>${esc(data.note||'-').replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target=_blank rel=noopener style="color:var(--a)">${u}</a>`)}</p>${u?`<p><a href="${esc(u)}" target=_blank style="color:var(--a)">ดาวน์โหลดไฟล์สินค้า</a></p>`:''}`)}
async function render(){
 if(view=='sell'&&$('#t'))return;
 $('#nav').innerHTML=`<b class=logo onclick="go('home')">PIXEL<span>MART</span></b><div class=nl><a onclick="go('home')">ตลาด</a>`+(me?`<a onclick="go('chats')">แชท</a><a onclick="go('mine')">บัญชี ฿${prof?.balance??0}</a>`+(isStaff()?`<a onclick="go('admin')">แอดมิน</a>`:'')+`<a onclick="db.auth.signOut()">ออก</a>`:`<a onclick="authM()">เข้าสู่ระบบ</a>`)+`<a class=cta onclick="go('sell')">+ ลงขาย</a></div>`;
 await({home,sell,mine,admin,chats,chat}[view])();
}
const EM={'เกม':'🎮','โมเดล 3D':'🧊','2D':'🖼️','UI':'🧩','ไอคอน':'⭐','สคริปต์':'💻','เสียง':'🔊','เพลง':'🎵'};
const card=l=>`<div class=card onclick="detail(${l.id})"><div class=ci>${l.image_url?`<img src="${esc(l.image_url)}" loading=lazy alt="">`:`<div class=ph>${EM[l.category]||'📦'}</div>`}<b class=pt>฿${Number(l.price).toLocaleString()}</b><div class=p><span class=m>${EM[l.category]||''} ${esc(l.category)}</span><h3>${esc(l.title)}</h3></div></div></div>`;
async function home(){
 let r=db.from('listings').select(LC).eq('status','live').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false});
 if(cat)r=r.eq('category',cat);if(q)r=r.ilike('title','%'+q.replace(/[%,]/g,'')+'%');
 const d=(await r).data||[];
 $('#main').innerHTML=`<section class=hero><h1>ตลาดของเกมสำหรับคนทำเกมไทย</h1><p class=m>โมเดล 3D, UI, ไอคอน, สคริปต์, เสียง และเพลง ลงขายง่าย คุยกับผู้ขายได้โดยตรง</p><input class=sr placeholder="ค้นหาสินค้า เช่น โมเดลรถ, UI เมนูเกม" value="${esc(q)}" onchange="q=this.value;home()"><div class=trust><span>ผู้ขายที่ยืนยันตัวตนมีป้ายรับรอง</span><span>แอดมินตรวจทุกชิ้นก่อนขึ้นขาย</span><span>รายงานปัญหาได้ทุกสินค้า</span></div></section><div class=tiles>`+['',...CATS].map(c=>`<b class="tile ${c==cat?'on':''}" onclick="cat='${c}';home()"><i>${EM[c]||'✨'}</i>${c||'ทั้งหมด'}</b>`).join('')+`</div><h2 class=sh>${cat||'สินค้าล่าสุด'} <small class=m>${d.length} ชิ้น</small></h2><div class=grid>`+(d.length?d.map(card).join(''):`<div class=empty><p>ยังไม่มีสินค้าในหมวดนี้</p><button onclick="go('sell')">ลงขายชิ้นแรก</button></div>`)+`</div>`;
}
async function detail(id){
 const{data:l}=await db.from('listings').select(LC).eq('id',id).single();if(!l)return;
 const s=(await db.from('seller_info').select('*').eq('id',l.seller).single()).data;
 modal(`${l.image_url?`<img class=big src="${esc(l.image_url)}" alt="">`:""}<h2>${esc(l.title)}</h2><p><b class=pr>฿${l.price}</b> <span class=m>${esc(l.category)}</span></p><p>ผู้ขาย ${esc(s?.name||'-')} ${badge(s?.role)}</p><p class=d>${esc(l.description)}</p><p id=ct></p><button onclick="contact(${l.id})">ติดต่อผู้ขาย</button> <button class=g onclick="report(${l.id})">รายงาน</button><p class=m>เว็บเป็นเพียงที่ฝากขาย ไม่รับผิดชอบการซื้อขายระหว่างผู้ใช้</p>`);
}
async function contact(id){if(!me)return authM();const{data,error}=await db.rpc('open_chat',{lid:id});if(error)return toast(error.message);closeM();openChat(data)}
async function report(id){if(!me)return authM();const r=prompt('เหตุผลที่รายงาน');if(!r)return;const{error}=await db.from('reports').insert({listing_id:id,reporter:me.id,reason:r});toast(error?error.message:'ส่งรายงานแล้ว')}
function authM(){modal(`<h2>สมาชิก</h2><input id=nm placeholder="ชื่อที่แสดง (ตอนสมัคร)"><input id=em type=email placeholder="อีเมล"><input id=pw type=password placeholder="รหัสผ่าน อย่างน้อย 6 ตัว"><button onclick="auth(1)">เข้าสู่ระบบ</button> <button class=g onclick="auth(0)">สมัครสมาชิก</button><p><a onclick=forgot() class=m style="cursor:pointer">ลืมรหัสผ่าน</a></p>`)}
async function auth(login){const e=$('#em').value,p=$('#pw').value;const r=login?await db.auth.signInWithPassword({email:e,password:p}):await db.auth.signUp({email:e,password:p,options:{data:{name:$('#nm').value}}});if(r.error)return toast(r.error.message);closeM();toast(login?'เข้าสู่ระบบแล้ว':'สมัครสำเร็จ')}
function sell(){
 if(!me){$('#main').innerHTML='<p>เข้าสู่ระบบก่อนลงขาย</p><button onclick=authM()>เข้าสู่ระบบ</button>';return}
 $('#main').innerHTML=`<h2>ลงขายสินค้า</h2><input id=t placeholder="ชื่อสินค้า"><select id=c>${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input id=pr type=number placeholder="ราคา (บาท)" oninput="fee()"><textarea id=ds rows=4 placeholder="รายละเอียดสินค้า"></textarea><label class=m>รูปตัวอย่าง <input id=im type=file accept="image/*" onchange="pickIM(this)"></label><p id=imn class=pr></p><input id=ct2 placeholder="ช่องทางติดต่อสำรองของคุณ (แอดมินเห็นเท่านั้น)"><textarea id=dn rows=3 placeholder="วางลิงก์ดาวน์โหลดสินค้า (Google Drive, Mega ฯลฯ) พร้อมรหัสและวิธีใช้ ผู้ซื้อเห็นหลังแอดมินส่งสินค้าเท่านั้น"></textarea><p id=fe class=pr></p><label class=m><input type=checkbox id=ok> ยอมรับ: ค่าลงไม่คืนเงินทุกกรณี แม้ไม่ผ่านการตรวจ และเว็บเป็นเพียงที่ฝากขาย ไม่รับผิดชอบการซื้อขาย</label><br><button onclick=submitL()>ลงขายและจ่ายค่าลง</button>`;fee();draftBind()}
let dfp=null,imu=null;
const sv=o=>{try{localStorage.setItem('up',JSON.stringify({...JSON.parse(localStorage.getItem('up')||'{}'),...o}))}catch(_){}};
async function pickIM(i){const g=i.files[0];if(!g)return;$('#imn').textContent='กำลังอัปโหลด...';const p=me.id+'/'+Date.now()+'-'+g.name.replace(/[^\w.]/g,'');const w=await db.storage.from('images').upload(p,g);if(w.error){$('#imn').textContent='';return toast(w.error.message)}imu=db.storage.from('images').getPublicUrl(p).data.publicUrl;sv({imu,imn:g.name});$('#imn').textContent='อัปโหลดแล้ว: '+g.name}
const DF=['t','c','pr','ds','ct2','dn','ok'];
function draftBind(){try{const d=JSON.parse(localStorage.getItem('draft')||'{}');DF.forEach(k=>{const e=$('#'+k);if(!e)return;if(k=='ok')e.checked=!!d[k];else if(d[k]!=null)e.value=d[k];['input','change'].forEach(ev=>e.addEventListener(ev,()=>{try{const x=JSON.parse(localStorage.getItem('draft')||'{}');x[k]=k=='ok'?e.checked:e.value;localStorage.setItem('draft',JSON.stringify(x))}catch(_){}}))});const up=JSON.parse(localStorage.getItem('up')||'{}');if(up.imu){imu=up.imu;$('#imn').textContent='อัปโหลดแล้ว: '+up.imn}fee()}catch(_){}}
function fee(){$('#fe').textContent='ค่าลง '+S.fee_percent+'% = ฿'+((+$('#pr').value||0)*S.fee_percent/100).toFixed(2)+' (หักจากยอดเงินในบัญชี)'}
async function submitL(){
 if(!$('#ok').checked)return toast('กรุณายอมรับเงื่อนไข');
 if(!$('#t').value||!(+$('#pr').value>0)||!$('#ct2').value||!$('#dn').value)return toast('กรอกชื่อ ราคา ช่องทางติดต่อ และลิงก์/ข้อมูลส่งมอบ');
 let url=imu;
 const{data,error}=await db.from('listings').insert({seller:me.id,title:$('#t').value,category:$('#c').value,price:+$('#pr').value,description:$('#ds').value,contact:$('#ct2').value,image_url:url,delivery_note:$('#dn').value,delivery_file:null}).select('id').single();
 if(error)return toast(error.message);
 try{localStorage.removeItem('draft');localStorage.removeItem('up')}catch(_){}dfp=null;imu=null;
 pay(data.id)}
async function pay(id){const{error}=await db.rpc('pay_listing',{lid:id});toast(error?error.message:'จ่ายแล้ว');await onMine()}
async function onMine(){const{data}=await db.from('profiles').select('*').eq('id',me.id).single();prof=data;go('mine')}
async function mine(){
 if(!me){$('#main').innerHTML='<button onclick=authM()>เข้าสู่ระบบ</button>';return}
 const L=(await db.from('listings').select(LC).eq('seller',me.id).order('id',{ascending:false})).data||[];
 const T=(await db.from('topups').select('*').eq('user_id',me.id).order('id',{ascending:false}).limit(10)).data||[];
 $('#main').innerHTML=`<h2>${esc(prof.name)} ${badge(prof.role)}</h2><p>ยอดเงิน <b class=pr>฿${prof.balance}</b> <button onclick=topM()>เติมเงิน</button></p><h3>สินค้าของฉัน</h3>`+L.map(l=>{const st=l.status=='live'&&new Date(l.expires_at)<Date.now()?'expired':l.status;return `<div class=row><span>${esc(l.title)} ฿${l.price}</span><span class=m>${ST[st]} ${esc(l.reject_reason||'')}</span>${st=='unpaid'?`<button onclick=pay(${l.id})>จ่ายค่าลง</button>`:''}${st=='expired'?`<button onclick=pay(${l.id})>ต่ออายุ</button>`:''}</div>`}).join('')+`<h3>ประวัติเติมเงิน</h3>`+T.map(t=>`<div class=row><span>฿${t.amount}</span><span class=m>${ST[t.status]||t.status}</span></div>`).join('');
}
function topM(){modal(`<h2>เติมเงิน</h2><input id=am type=number placeholder="ยอดเงิน (บาท)"><p>โอนเข้า: <b>${esc(S.bank_info)}</b></p><label class=m>แนบสลิป <input id=sl type=file accept="image/*"></label><button onclick=topUp()>แจ้งเติมเงิน</button><p class=m>แอดมินตรวจสอบภายใน 10-15 นาที</p>`)}
async function topUp(){const f=$('#sl').files[0],a=+$('#am').value;if(!f||!(a>0))return toast('ใส่ยอดและแนบสลิป');const p=me.id+'/'+Date.now()+'.jpg';const u=await db.storage.from('slips').upload(p,f);if(u.error)return toast(u.error.message);const{error}=await db.from('topups').insert({user_id:me.id,amount:a,slip_url:p});toast(error?error.message:'ส่งแล้ว รอตรวจสอบ');closeM();mine()}
async function admin(){
 if(!isStaff()){$('#main').textContent='ไม่มีสิทธิ์เข้าหน้านี้';return}
 const T=(await db.from('topups').select('*').eq('status','pending')).data||[];
 const L=(await db.from('listings').select(LC).eq('status','pending')).data||[];
 const R=(await db.from('reports').select('*').eq('status','open')).data||[];
 let h='<h2>ตรวจสลิป</h2>';
 for(const t of T){const u=(await db.storage.from('slips').createSignedUrl(t.slip_url,300)).data?.signedUrl;h+=`<div class=row><a href="${esc(u)}" target=_blank style="color:var(--a)">ดูสลิป</a><span>฿${t.amount}</span><button onclick="rpc('approve_topup',{tid:${t.id}})">อนุมัติ</button><button class=g onclick="rpc('reject_topup',{tid:${t.id}})">ปฏิเสธ</button></div>`}
 h+='<h2>สินค้ารอตรวจ</h2>'+L.map(l=>`<div class=row><span>${esc(l.title)} ฿${l.price} (ค่าลง ฿${l.fee_paid})</span><button class=g onclick="detail(${l.id})">ดู</button><button onclick="rpc('approve_listing',{lid:${l.id}})">อนุมัติ</button><button class=g onclick="rej(${l.id})">ไม่ผ่าน</button></div>`).join('');
 h+='<h2>รายงานปัญหา</h2>'+R.map(r=>`<div class=row><span>สินค้า #${r.listing_id}: ${esc(r.reason)}</span><button onclick="rpc('close_report',{rid:${r.id}})">ปิดเรื่อง</button></div>`).join('');
 if(isCeo())h+=`<h2>CEO</h2><p>ค่าลง % <input id=fp value="${esc(S.fee_percent)}"> ค่าต่ออายุ % <input id=rp value="${esc(S.renew_percent)}"></p><p>บัญชีรับเงิน <input id=bk value="${esc(S.bank_info)}"></p><button onclick=saveS()>บันทึก</button><p>ตั้งยศ <input id=re placeholder="อีเมลสมาชิก"><select id=ro><option>member<option>verified<option>admin<option>ceo</select><button onclick=setRole()>ตั้งยศ</button></p>`;
 $('#main').innerHTML=h}
async function rpc(f,a){const{error}=await db.rpc(f,a);toast(error?error.message:'สำเร็จ');admin()}
async function rej(id){const r=prompt('เหตุผลที่ไม่ผ่าน');if(r)rpc('reject_listing',{lid:id,reason:r})}
async function saveS(){for(const[k,v]of[['fee_percent',$('#fp').value],['renew_percent',$('#rp').value],['bank_info',$('#bk').value]])await db.rpc('set_setting',{p_k:k,p_v:v});await loadS();toast('บันทึกแล้ว')}
function setRole(){rpc('set_role',{p_email:$('#re').value,p_role:$('#ro').value})}
</script></body></html>
